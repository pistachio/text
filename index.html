<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title Case Tool</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --panel: #252526;
            --text: #d4d4d4;
            --border: #3c3c3c;
            --accent: #d97757;
            --btn-bg: #333333;
            --btn-hover: #444444;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 800px;
        }

        .panel {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: transparent;
            color: var(--text);
            border: none;
            padding: 20px;
            font-size: 16px;
            line-height: 1.5;
            resize: none;
            outline: none;
            box-sizing: border-box;
            font-family: monospace;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px;
            background-color: #2d2d2d;
            border-top: 1px solid var(--border);
            align-items: center;
            justify-content: space-between;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            background-color: var(--btn-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background-color: var(--btn-hover);
            border-color: #555;
        }

        .stats {
            font-size: 12px;
            color: #888;
            display: flex;
            gap: 16px;
        }

        .transform-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- INPUT PANEL -->
    <div class="panel">
        <textarea id="inputText" placeholder="Type or paste your title here..."></textarea>
        <div class="toolbar">
            <div class="btn-group">
                <button onclick="clearText()">🗑 Clear</button>
            </div>
            <div class="stats" id="inputStats">Chars: 0 | Words: 0 | Lines: 0</div>
        </div>
    </div>

    <!-- TRANSFORM BUTTONS -->
    <div class="transform-bar">
        <button onclick="convertCase('sentence')">Sentence case</button>
        <button onclick="convertCase('lower')">lower case</button>
        <button onclick="convertCase('upper')">UPPER CASE</button>
        <button onclick="convertCase('capitalized')">Capitalized Case</button>
        <button onclick="convertCase('alternating')">aLtErNaTiNg cAsE</button>
        <button onclick="convertCase('title')">Title Case</button>
        <button onclick="convertCase('inverse')">InVeRsE CaSe</button>
        <button onclick="convertCase('unstyle')">Unstyle Text</button>
    </div>
</div>

<script>
    const inputTx = document.getElementById('inputText');
    const statsEl = document.getElementById('inputStats');

    // Update stats on input
    inputTx.addEventListener('input', updateStats);

    function updateStats() {
        const text = inputTx.value;
        const chars = text.length;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        const lines = text ? text.split('\n').length : 0;
        statsEl.textContent = `Chars: ${chars} | Words: ${words} | Lines: ${lines}`;
    }

    function clearText() {
        inputTx.value = '';
        updateStats();
    }

    // Case Conversion Logic
    function convertCase(type) {
        let text = inputTx.value;
        if (!text) return;

        switch(type) {
            case 'lower':
                inputTx.value = text.toLowerCase();
                break;
            case 'upper':
                inputTx.value = text.toUpperCase();
                break;
            case 'sentence':
                inputTx.value = text.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());
                break;
            case 'capitalized':
                inputTx.value = text.replace(/\b\w/g, c => c.toUpperCase());
                break;
            case 'alternating':
                let altText = '';
                let makeUpper = true;
                for (let char of text) {
                    if (/[a-zA-Z]/.test(char)) {
                        altText += makeUpper ? char.toUpperCase() : char.toLowerCase();
                        makeUpper = !makeUpper;
                    } else {
                        altText += char;
                    }
                }
                inputTx.value = altText;
                break;
            case 'title':
                const smallWords = /^(a|an|and|as|at|but|by|en|for|if|in|of|on|or|the|to|v\.?|via|vs\.?)$/i;
                inputTx.value = text.toLowerCase().split(' ').map((word, index) => {
                    if (index === 0 || !smallWords.test(word)) {
                        return word.charAt(0).toUpperCase() + word.slice(1);
                    }
                    return word;
                }).join(' ');
                break;
            case 'inverse':
                inputTx.value = text.split('').map(c => {
                    if (c === c.toUpperCase()) return c.toLowerCase();
                    if (c === c.toLowerCase()) return c.toUpperCase();
                    return c;
                }).join('');
                break;
            case 'unstyle':
                // 1. Normalize the text using NFKD (Compatibility Decomposition).
                // This automatically turns 𝑩𝒐𝒍𝒅, 𝘐𝘵𝘢𝘭𝘪𝘤, Ｆｕｌｌｗｉｄｔｈ, and Ⓒⓘⓡⓒⓛⓔⓓ back to standard ASCII.
                let unstyledText = text.normalize('NFKD');
                
                // 2. Remove any leftover combining diacritical marks (accents) 
                unstyledText = unstyledText.replace(/[\u0300-\u036f]/g, '');
                
                // 3. Handle Small Caps (ᴀ, ʙ, ᴄ) which do not decompose via NFKD.
                const smallCapsMap = {
                    'ᴀ':'a','ʙ':'b','ᴄ':'c','ᴅ':'d','ᴇ':'e','ꜰ':'f','ɢ':'g','ʜ':'h','ɪ':'i','ᴊ':'j',
                    'ᴋ':'k','ʟ':'l','ᴍ':'m','ɴ':'n','ᴏ':'o','ᴘ':'p','ǫ':'q','ʀ':'r','ꜱ':'s','ᴛ':'t',
                    'ᴜ':'u','ᴠ':'v','ᴡ':'w','x':'x','ʏ':'y','ᴢ':'z'
                };
                
                unstyledText = unstyledText.replace(/[ᴀ-ᴢ]/g, function(match) {
                    return smallCapsMap[match] || match;
                });

                inputTx.value = unstyledText;
                break;
        }
        
        // Update the character/word count immediately after transforming
        updateStats();
    }
</script>
</body>
</html>
