<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Utility Tool</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --panel: #252526;
            --text: #d4d4d4;
            --border: #3c3c3c;
            --accent: #d97757;
            --btn-bg: #333333;
            --btn-hover: #444444;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100%;
        }

        .panel {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            color: var(--text);
            border: none;
            padding: 20px;
            font-size: 16px;
            line-height: 1.5;
            resize: none;
            outline: none;
            box-sizing: border-box;
            font-family: monospace;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px;
            background-color: #2d2d2d;
            border-top: 1px solid var(--border);
            align-items: center;
            justify-content: space-between;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            background-color: var(--btn-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background-color: var(--btn-hover);
            border-color: #555;
        }

        button.primary {
            background-color: var(--accent);
            color: white;
            border: none;
        }

        button.primary:hover {
            background-color: #c9664a;
        }

        .stats {
            font-size: 12px;
            color: #888;
            display: flex;
            gap: 16px;
        }

        .output-header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2d2d2d;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- INPUT PANEL -->
    <div class="panel">
        <textarea id="inputText" placeholder="Type or paste your content here..."></textarea>
        <div class="toolbar">
            <div class="btn-group">
                <button onclick="clearText()">🗑 Clear</button>
                <button onclick="copyText('inputText')">📋 Copy</button>
            </div>
            <div class="stats" id="inputStats">Chars: 0 | Words: 0 | Lines: 0</div>
        </div>
    </div>

    <!-- TRANSFORM BUTTONS -->
    <div class="toolbar" style="background: transparent; border: none; padding: 0;">
        <div class="btn-group">
            <button onclick="convertCase('sentence')">Sentence case</button>
            <button onclick="convertCase('lower')">lower case</button>
            <button onclick="convertCase('upper')">UPPER CASE</button>
            <button onclick="convertCase('capitalized')">Capitalized Case</button>
            <button onclick="convertCase('alternating')">aLtErNaTiNg cAsE</button>
            <button onclick="convertCase('title')">Title Case</button>
            <button onclick="convertCase('inverse')">InVeRsE CaSe</button>
        </div>
    </div>

    <!-- OUTPUT PANEL -->
    <div class="panel" style="flex: 0.6;">
        <div class="output-header">
            <span>Result</span>
            <button class="primary" onclick="copyText('outputText')">Copy Result</button>
        </div>
        <textarea id="outputText" readonly placeholder="Transformed text will appear here..."></textarea>
    </div>
</div>

<script>
    const inputTx = document.getElementById('inputText');
    const outputTx = document.getElementById('outputText');
    const statsEl = document.getElementById('inputStats');

    // Update stats on input
    inputTx.addEventListener('input', updateStats);

    function updateStats() {
        const text = inputTx.value;
        const chars = text.length;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        const lines = text ? text.split('\n').length : 0;
        statsEl.textContent = `Chars: ${chars} | Words: ${words} | Lines: ${lines}`;
    }

    function clearText() {
        inputTx.value = '';
        outputTx.value = '';
        updateStats();
    }

    function copyText(id) {
        const text = document.getElementById(id).value;
        if (!text) return;
        navigator.clipboard.writeText(text).then(() => {
            alert('Copied to clipboard!');
        });
    }

    // Case Conversion Logic
    function convertCase(type) {
        let text = inputTx.value;
        if (!text) return;

        switch(type) {
            case 'lower':
                outputTx.value = text.toLowerCase();
                break;
            case 'upper':
                outputTx.value = text.toUpperCase();
                break;
            case 'sentence':
                // Capitalize first letter of every sentence
                outputTx.value = text.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());
                break;
            case 'capitalized':
                // Capitalize first letter of every word
                outputTx.value = text.replace(/\b\w/g, c => c.toUpperCase());
                break;
            case 'alternating':
                let altText = '';
                let makeUpper = true;
                for (let char of text) {
                    if (/[a-zA-Z]/.test(char)) {
                        altText += makeUpper ? char.toUpperCase() : char.toLowerCase();
                        makeUpper = !makeUpper;
                    } else {
                        altText += char;
                    }
                }
                outputTx.value = altText;
                break;
            case 'title':
                const smallWords = /^(a|an|and|as|at|but|by|en|for|if|in|of|on|or|the|to|v\.?|via|vs\.?)$/i;
                outputTx.value = text.toLowerCase().split(' ').map((word, index) => {
                    if (index === 0 || !smallWords.test(word)) {
                        return word.charAt(0).toUpperCase() + word.slice(1);
                    }
                    return word;
                }).join(' ');
                break;
            case 'inverse':
                outputTx.value = text.split('').map(c => {
                    if (c === c.toUpperCase()) return c.toLowerCase();
                    if (c === c.toLowerCase()) return c.toUpperCase();
                    return c;
                }).join('');
                break;
        }
    }
</script>
</body>
</html>
